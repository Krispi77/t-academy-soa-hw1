services:
  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Применяет миграции из ./migrations и завершается.
  migrations:
    image: flyway/flyway:11-alpine
    container_name: marketplace-migrations
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/marketplace
      FLYWAY_USER: marketplace
      FLYWAY_PASSWORD: marketplace
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: 10
    volumes:
      - ./migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    container_name: marketplace-app
    environment:
      DATABASE_URL: postgres://marketplace:marketplace@postgres:5432/marketplace?sslmode=disable
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully

volumes:
  pgdata:
