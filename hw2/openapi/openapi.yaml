openapi: 3.0.3
info:
  title: Marketplace API
  version: 1.0.0
  description: |
    API сервиса маркетплейса.

    Текущая версия описывает CRUD для сущности `Product`.
    Удаление товара — мягкое: запись не удаляется физически,
    а переводится в статус `ARCHIVED`.

    Каждый ответ содержит заголовок `X-Request-Id` — уникальный
    идентификатор запроса (UUID), по которому запрос можно найти в логах.

servers:
  - url: http://localhost:8080
    description: Локальное окружение

tags:
  - name: Products
    description: Управление каталогом товаров

paths:
  /products:
    post:
      tags: [Products]
      operationId: createProduct
      summary: Создание товара
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Товар создан
          headers:
            Location:
              description: URL созданного товара
              schema:
                type: string
                example: /products/3fa85f64-5717-4562-b3fc-2c963f66afa6
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [Products]
      operationId: listProducts
      summary: Список товаров с пагинацией и фильтрацией
      description: |
        Возвращает страницу товаров, отсортированных по времени создания
        (новые первыми). Фильтры `status` и `category` необязательны и
        комбинируются через логическое И. Без фильтров возвращаются товары
        во всех статусах.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/CategoryFilter'
      responses:
        '200':
          description: Страница товаров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'

    get:
      tags: [Products]
      operationId: getProductById
      summary: Получение товара по ID
      responses:
        '200':
          description: Найденный товар
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Products]
      operationId: updateProduct
      summary: Обновление товара
      description: |
        Полная замена изменяемых полей товара: все обязательные поля
        должны быть переданы. `id`, `created_at` и `updated_at`
        управляются сервером и в запросе не передаются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Товар обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Мягкое удаление товара
      description: |
        Переводит товар в статус `ARCHIVED`; запись в БД сохраняется.
        Операция идемпотентна: повторный вызов для уже архивного товара
        возвращает `200` с тем же состоянием.
      responses:
        '200':
          description: Товар переведён в статус ARCHIVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Идентификатор товара
      schema:
        type: string
        format: uuid

    Page:
      name: page
      in: query
      required: false
      description: Номер страницы, начиная с 0
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0

    Size:
      name: size
      in: query
      required: false
      description: Размер страницы
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

    StatusFilter:
      name: status
      in: query
      required: false
      description: Фильтр по статусу товара
      schema:
        $ref: '#/components/schemas/ProductStatus'

    CategoryFilter:
      name: category
      in: query
      required: false
      description: Фильтр по категории (точное совпадение)
      schema:
        type: string
        minLength: 1
        maxLength: 100
        example: electronics

  schemas:
    ProductStatus:
      type: string
      description: Состояние товара
      enum:
        - ACTIVE
        - INACTIVE
        - ARCHIVED
      example: ACTIVE

    Price:
      type: number
      format: decimal
      description: |
        Цена товара, строго больше 0. Хранится как DECIMAL(12,2):
        значение округляется до 2 знаков после запятой.
      minimum: 0.01
      maximum: 9999999999.99
      example: 19990.00
      x-go-type: decimal.Decimal
      x-go-type-import:
        path: github.com/shopspring/decimal

    ProductCreate:
      type: object
      description: Тело запроса на создание товара
      additionalProperties: false
      required:
        - name
        - price
        - stock
        - category
        - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Смартфон X100
        description:
          type: string
          nullable: true
          maxLength: 4000
          example: 6.5" экран, 128 ГБ
        price:
          $ref: '#/components/schemas/Price'
        stock:
          type: integer
          format: int32
          description: Остаток на складе
          minimum: 0
          example: 15
        category:
          type: string
          minLength: 1
          maxLength: 100
          example: electronics
        status:
          $ref: '#/components/schemas/ProductStatus'

    ProductUpdate:
      type: object
      description: Тело запроса на обновление товара (полная замена)
      additionalProperties: false
      required:
        - name
        - price
        - stock
        - category
        - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Смартфон X100 Pro
        description:
          type: string
          nullable: true
          maxLength: 4000
          example: 6.5" экран, 256 ГБ
        price:
          $ref: '#/components/schemas/Price'
        stock:
          type: integer
          format: int32
          description: Остаток на складе
          minimum: 0
          example: 10
        category:
          type: string
          minLength: 1
          maxLength: 100
          example: electronics
        status:
          $ref: '#/components/schemas/ProductStatus'

    ProductResponse:
      type: object
      description: Товар в ответе API
      required:
        - id
        - name
        - description
        - price
        - stock
        - category
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name:
          type: string
          example: Смартфон X100
        description:
          type: string
          nullable: true
          description: null, если описание не задано
          example: 6.5" экран, 128 ГБ
        price:
          $ref: '#/components/schemas/Price'
        stock:
          type: integer
          format: int32
          example: 15
        category:
          type: string
          example: electronics
        status:
          $ref: '#/components/schemas/ProductStatus'
        created_at:
          type: string
          format: date-time
          example: '2026-10-21T10:15:30Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-10-21T12:00:00Z'

    ProductPage:
      type: object
      description: Страница списка товаров
      required:
        - content
        - totalElements
        - page
        - size
      properties:
        content:
          type: array
          description: Товары на текущей странице
          items:
            $ref: '#/components/schemas/ProductResponse'
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: Общее количество товаров, подходящих под фильтр
          example: 42
        page:
          type: integer
          format: int32
          minimum: 0
          description: Номер текущей страницы (с 0)
          example: 0
        size:
          type: integer
          format: int32
          minimum: 1
          description: Размер страницы
          example: 20

    ErrorCode:
      type: string
      description: |
        Каталог машиночитаемых кодов ошибок и соответствующих HTTP-статусов.

        | Код                         | HTTP | Когда возвращается                                |
        |-----------------------------|------|---------------------------------------------------|
        | `PRODUCT_NOT_FOUND`         | 404  | Товар не найден по ID                             |
        | `PRODUCT_INACTIVE`          | 409  | Попытка заказать неактивный товар                 |
        | `ORDER_NOT_FOUND`           | 404  | Заказ не найден по ID                             |
        | `ORDER_LIMIT_EXCEEDED`      | 429  | Превышен лимит частоты создания/обновления заказа |
        | `ORDER_HAS_ACTIVE`          | 409  | У пользователя уже есть активный заказ            |
        | `INVALID_STATE_TRANSITION`  | 409  | Недопустимый переход состояния заказа             |
        | `INSUFFICIENT_STOCK`        | 409  | Недостаточно товара на складе                     |
        | `PROMO_CODE_INVALID`        | 422  | Промокод не найден, истёк, исчерпан или неактивен |
        | `PROMO_CODE_MIN_AMOUNT`     | 422  | Сумма заказа ниже минимальной для промокода       |
        | `ORDER_OWNERSHIP_VIOLATION` | 403  | Заказ принадлежит другому пользователю            |
        | `VALIDATION_ERROR`          | 400  | Ошибка валидации входных данных                   |
        | `INTERNAL_ERROR`            | 500  | Непредвиденная ошибка сервера                     |

        Коды заказов и промокодов зарезервированы для API заказов.
      enum:
        - PRODUCT_NOT_FOUND
        - PRODUCT_INACTIVE
        - ORDER_NOT_FOUND
        - ORDER_LIMIT_EXCEEDED
        - ORDER_HAS_ACTIVE
        - INVALID_STATE_TRANSITION
        - INSUFFICIENT_STOCK
        - PROMO_CODE_INVALID
        - PROMO_CODE_MIN_AMOUNT
        - ORDER_OWNERSHIP_VIOLATION
        - VALIDATION_ERROR
        - INTERNAL_ERROR
      example: PRODUCT_NOT_FOUND

    ErrorResponse:
      type: object
      description: Единый формат ошибки
      required:
        - error_code
        - message
      properties:
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Человекочитаемое описание
          example: Product with id 3fa85f64-5717-4562-b3fc-2c963f66afa6 not found
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: Дополнительные данные (опционально)

  responses:
    ValidationError:
      description: |
        Ошибка валидации входных данных (`VALIDATION_ERROR`).
        В `details.fields` перечислены поля и нарушенные ограничения.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: VALIDATION_ERROR
            message: Request validation failed
            details:
              fields:
                - field: price
                  message: number must be at least 0.01
                - field: name
                  message: minimum string length is 1

    ProductNotFound:
      description: Товар не найден (`PRODUCT_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: PRODUCT_NOT_FOUND
            message: Product with id 3fa85f64-5717-4562-b3fc-2c963f66afa6 not found
            details:
              product_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6

    InternalError:
      description: Непредвиденная ошибка сервера (`INTERNAL_ERROR`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: INTERNAL_ERROR
            message: Internal server error
