services:
  catalog-service:
    build:
      context: ./catalog-service
    container_name: marketplace-catalog-service
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
